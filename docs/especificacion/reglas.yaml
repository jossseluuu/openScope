    code: constants/aircraftConstants.js (PERFORMANCE.TAKEOFF_TURN_ALTITUDE)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: TAKEOFF_TURN_ALTITUDE, equals: 400 }
    status: implementado
  - id: PER-006
    rule: Distancia de anticipación máxima para virar antes de un punto de recorrido (fly-by)
    value: 5
    unit: NM
    source: Aproximación del motor
    code: constants/aircraftConstants.js (PERFORMANCE.MAXIMUM_DISTANCE_TO_FLY_BY_WAYPOINT_NM)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: MAXIMUM_DISTANCE_TO_FLY_BY_WAYPOINT_NM, equals: 5 }
    status: implementado

  # ---------------------------------------------------------------- APP
  - id: APP-001
    rule: Una aeronave está establecida en el localizador si está a menos de ~500 ft del eje y con menos de 5° de diferencia de rumbo
    value: 0,0822894 NM y 5°
    source: Aproximación del motor
    code: constants/aircraftConstants.js (PERFORMANCE.MAXIMUM_DISTANCE_CONSIDERED_ESTABLISHED_ON_APPROACH_COURSE_NM, MAXIMUM_ANGLE_CONSIDERED_ESTABLISHED_ON_APPROACH_COURSE)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: MAXIMUM_DISTANCE_CONSIDERED_ESTABLISHED_ON_APPROACH_COURSE_NM, equals: 0.0822894 }
    status: implementado
  - id: APP-002
    rule: Una aeronave está establecida en la senda de planeo si está a menos de 100 ft de ella
    value: 100
    unit: ft
    source: Aproximación del motor
    code: constants/aircraftConstants.js (PERFORMANCE.MAXIMUM_ALTITUDE_DIFFERENCE_CONSIDERED_ESTABLISHED_ON_GLIDEPATH)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: MAXIMUM_ALTITUDE_DIFFERENCE_CONSIDERED_ESTABLISHED_ON_GLIDEPATH, equals: 100 }
    status: implementado
  - id: APP-003
    rule: Puerta de aproximación estabilizada
    value: 1000
    unit: ft sobre el umbral
    source: Flight Safety Foundation ALAR; criterios de aproximación estabilizada de los operadores
    code: constants/aircraftConstants.js (PERFORMANCE.STABILIZED_APPROACH_HEIGHT_FT)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: STABILIZED_APPROACH_HEIGHT_FT, equals: 1000 }
    status: implementado
    notes: Margen lateral de 0,5 NM (STABILIZED_APPROACH_MARGIN_NM) y velocidad hasta 20 kt sobre la de aterrizaje (realism/RealismController.js, STABILIZED_APPROACH_SPEED_MARGIN_KT). Fuera de criterios, frustrada.
  - id: APP-004
    rule: Altitud mínima de descenso de la aproximación instrumental (equivale a la DH de una CAT I)
    value: 200
    unit: ft
    source: ICAO Anexo 6 / Doc 9365 (CAT I, DH 200 ft)
    code: constants/aircraftConstants.js (PERFORMANCE.INSTRUMENT_APPROACH_MINIMUM_DESCENT_ALTITUDE)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: INSTRUMENT_APPROACH_MINIMUM_DESCENT_ALTITUDE, equals: 200 }
    status: implementado
    notes: Las categorías II y III llegan con la visibilidad (#6b).
  - id: APP-005
    rule: Si la pista no está libre a 200 ft sobre el umbral, el piloto hace la frustrada
    value: 200
    unit: ft
    source: Altura de decisión típica
    code: realism/RealismController.js (RUNWAY_CLEAR_DECISION_HEIGHT_FT)
    status: implementado
  - id: APP-006
    rule: Separación radar mínima en la aproximación final
    value: "EASA 2,5 NM (RECAT-EU, separación radar mínima reducida); ICAO y FAA 3 NM"
    source: ICAO Doc 4444 8.7.3.2; RECAT-EU; FAA JO 7110.65 5-5-4
    code: realism/regulatoryProfiles.js (finalApproachSeparationNm)
    check: { module: realism/regulatoryProfiles, export: REGULATORY_PROFILE, path: EASA.finalApproachSeparationNm, equals: 2.5 }
    status: implementado
  - id: APP-007
    rule: Tiempo de ocupación de pista en el aterrizaje por categoría RECAT-EU (varía entre el 90 % y el 120 % según la salida y el frenado)
    value: { A: 70, B: 62, C: 58, D: 52, E: 50, F: 45 }
    unit: s
    source: Aproximación del motor
    code: realism/wakeTurbulence.js (LANDING_RUNWAY_OCCUPANCY_SECONDS)
    check: { module: realism/wakeTurbulence, export: LANDING_RUNWAY_OCCUPANCY_SECONDS, path: A, equals: 70 }
