    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: TURN_RATE, equals: 0.0523598776 }
    status: implementado
  - id: PER-002
    rule: Fracción de la tasa máxima de ascenso que se usa normalmente
    value: 0.7
    source: Aproximación del motor
    code: constants/aircraftConstants.js (PERFORMANCE.TYPICAL_CLIMB_FACTOR)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: TYPICAL_CLIMB_FACTOR, equals: 0.7 }
    status: implementado
  - id: PER-003
    rule: Fracción de la tasa máxima de descenso que se usa normalmente
    value: 0.7
    source: Aproximación del motor
    code: constants/aircraftConstants.js (PERFORMANCE.TYPICAL_DESCENT_FACTOR)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: TYPICAL_DESCENT_FACTOR, equals: 0.7 }
    status: implementado
  - id: PER-004
    rule: Factor de deceleración en tierra con frenos
    value: 3.5
    source: Aproximación del motor
    code: constants/aircraftConstants.js (PERFORMANCE.DECELERATION_FACTOR_DUE_TO_GROUND_BRAKING)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: DECELERATION_FACTOR_DUE_TO_GROUND_BRAKING, equals: 3.5 }
    status: implementado
  - id: PER-005
