# Hoja de especificaciones físicas y reglas de dominio del simulador.
#
# Fuente única: las páginas docs/especificacion/*.md se generan desde este archivo con
#   node tools/docs/generate-spec.js
# y el test test/spec/reglas.spec.js comprueba que cada regla con `check` coincide con el código.
#
# Campos de cada regla:
#   id        identificador estable (DOMINIO-NNN). El código y los tests lo citan en comentarios.
#   rule      enunciado en español
#   value     valor (número, texto o tabla); unit: unidad
#   source    norma o referencia de la que sale el valor
#   code      dónde está implementado (ruta desde src/assets/scripts/client/, y nombre)
#   check     (opcional) comprobación automática: módulo, export, ruta dentro del export y valor esperado
#   status    implementado | parcial | pendiente | referencia (dato de contexto, no se usa en el motor)
#   notes     (opcional) aclaraciones, diferencias con la realidad, decisiones

domains:
  - { id: UNI, title: Unidades y referencias, page: unidades-atmosfera }
  - { id: ATM, title: Atmósfera y viento, page: unidades-atmosfera }
  - { id: VEL, title: Velocidades, page: aeronaves }
  - { id: PER, title: Rendimiento de las aeronaves, page: aeronaves }
  - { id: APP, title: Aproximación y aterrizaje, page: aeronaves }
  - { id: SEP, title: Separación radar, page: separacion }
  - { id: WAK, title: Estela turbulenta, page: separacion }
  - { id: PAR, title: Pistas paralelas, page: separacion }
  - { id: DEP, title: Salidas y torre, page: operaciones }
  - { id: ASP, title: Espacio aéreo, page: espacio-aereo-terreno }
  - { id: TER, title: Terreno y altitudes mínimas, page: espacio-aereo-terreno }
  - { id: EMG, title: Emergencias, page: operaciones }
  - { id: SCO, title: Puntuación y niveles de las reglas, page: puntuacion }
  - { id: STC, title: STCA (alerta de conflicto en tierra), page: alertas }
  - { id: TCA, title: TCAS II / ACAS II, page: alertas }
  - { id: MSW, title: MSAW (aviso de altitud mínima), page: alertas }
  - { id: APW, title: APW (aviso de proximidad a zona restringida), page: alertas }
  - { id: MET, title: Meteorología, page: meteorologia }

rules:
  # ---------------------------------------------------------------- UNI
  - id: UNI-001
    rule: Las distancias se muestran en millas náuticas; internamente el motor trabaja en kilómetros
    value: 1 NM = 1,852 km
    source: ICAO Anexo 5
    code: constants/globalConstants.js (PHYSICS_CONSTANTS)
    check: { module: constants/globalConstants, export: PHYSICS_CONSTANTS, path: EARTH_RADIUS_NM, equals: 3440 }
    status: implementado
    notes: El radio terrestre en NM (3440) se usa para las conversiones; en km es 6370,88.
  - id: UNI-002
    rule: Las altitudes de las aeronaves son en pies sobre el nivel del mar; los suelos y techos del espacio aéreo, en niveles de vuelo (centenas de pies)
    value: ft MSL / FL
    source: ICAO Anexo 5; formato de aeropuerto
    code: airport/AirspaceModel.js
    status: implementado
  - id: UNI-003
    rule: Los rumbos que ve el jugador son magnéticos; cada aeropuerto declara su declinación (positiva al este)
    value: magnetic_north
    unit: grados
    source: Formato de aeropuerto
    code: airport/AirportModel.js (magneticNorth)
    status: implementado
  - id: UNI-004
    rule: Las velocidades que se ordenan son indicadas (IAS)
    value: IAS
    unit: kt
    source: ICAO Doc 4444 4.6
    code: aircraft/AircraftModel.js (speed)
    status: implementado
  - id: UNI-005
    rule: Reglaje altimétrico por defecto (atmósfera estándar)
    value: 29.92
    unit: inHg (1013,25 hPa)
    source: ICAO Doc 7488
    code: constants/aircraftConstants.js (PERFORMANCE.DEFAULT_ALTIMETER_IN_INHG)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: DEFAULT_ALTIMETER_IN_INHG, equals: 29.92 }
    status: implementado
    notes: No hay QNH variable ni altitud de transición; todo se trata como altitud. Llega con la meteorología (#6).

  # ---------------------------------------------------------------- ATM
  - id: ATM-001
    rule: La velocidad verdadera (TAS) crece linealmente con la altitud a partir de la indicada
    value: TAS = IAS × (1 + 0,000016 × altitud)
    unit: "+1,6 % por cada 1000 ft"
    source: Aproximación del motor (regla práctica ≈ 2 % por 1000 ft)
    code: aircraft/AircraftModel.js (updateGroundSpeedPhysics), constants/environmentConstants.js (DENSITY_ALT_INCREASE_FACTOR_PER_FT)
    check: { module: constants/environmentConstants, export: ENVIRONMENT, path: DENSITY_ALT_INCREASE_FACTOR_PER_FT, equals: 0.000016 }
    status: parcial
    notes: >-
      Auditoría 2026-11-20. El comentario del código dice "0,16 % por mil pies" pero el valor es 1,6 %.
      Frente a la atmósfera estándar (ISA) se queda corto en altura: a FL240 la TAS real es ≈ IAS × 1,45 y el
      motor da × 1,38; a FL390 la real es ≈ × 2,0 y el motor da × 1,62. No modela temperatura ni Mach.
  - id: ATM-002
    rule: El viento crece con la altitud a partir del de superficie
    value: "+2 % por cada 1000 ft"
    source: Aproximación del motor
    code: airport/AirportModel.js (getWindAtAltitude), constants/environmentConstants.js (WIND_INCREASE_FACTOR_PER_FT)
    check: { module: constants/environmentConstants, export: ENVIRONMENT, path: WIND_INCREASE_FACTOR_PER_FT, equals: 0.00002 }
    status: parcial
    notes: La dirección no cambia con la altura. El perfil por capas llega con la meteorología dinámica (#6).
  - id: ATM-003
    rule: El viento se suma como vector a la velocidad verdadera; la aeronave corrige la deriva (ángulo de corrección)
    value: GS = TAS + viento (vectorial)
    source: Navegación aérea
    code: aircraft/AircraftModel.js (updateGroundSpeedPhysics, corrección de deriva)
    status: implementado
    notes: En tierra la trayectoria se fija al eje de pista para que el viento no saque a la aeronave.
  - id: ATM-004
    rule: Atmósfera estándar internacional (ISA) de referencia
    value: 15 °C y 1013,25 hPa al nivel del mar; -1,98 °C por 1000 ft; tropopausa a 36 089 ft
    source: ICAO Doc 7488
    code: "—"
    status: referencia
    notes: No se usa todavía en el motor; servirá para corregir ATM-001.

  # ---------------------------------------------------------------- VEL
  - id: VEL-001
    rule: Límite de velocidad por debajo de 10 000 ft
    value: 250
    unit: kt IAS
    source: SERA.6001 y anexo (Europa); FAA 14 CFR 91.117
    code: aircraft/AircraftModel.js (límite bajo 10 000 ft)
    status: implementado
    notes: El motor lo aplica a todas las aeronaves, sin excepciones por clase de espacio aéreo.

  - id: VEL-002
    rule: En los últimos 1000 ft antes del nivel autorizado, ascensos y descensos a 1500 ft/min como máximo (salvo orden expedita, despegue o RA)
    value: "1500 ft/min en los últimos 1000 ft"
    source: ICAO Doc 8168 Vol I (procedimientos ACAS, evitar RA innecesarios con tráfico a 1000 ft); obligatorio para operadores en Europa
    code: constants/aircraftConstants.js (PERFORMANCE.LEVEL_OFF_BAND_FT, LEVEL_OFF_MAX_RATE_FPM); aircraft/AircraftModel.js; bot/botA/conflictResolution.js (altitudeTowardLevel)
    check: { module: constants/aircraftConstants, export: PERFORMANCE, path: LEVEL_OFF_MAX_RATE_FPM, equals: 1500 }
    status: implementado
    notes: Añadida el 2026-11-20 al activar el TCAS. Sin ella casi todos los RA eran nivelaciones a 1000 ft de otra aeronave (el clásico level-off RA).

