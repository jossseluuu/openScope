    check: { module: realism/regulatoryProfiles, export: REGULATORY_PROFILE, path: ICAO.radarSeparationNm, equals: 3 }
    status: implementado
    notes: En ruta la norma es 5 NM, pero el simulador solo representa áreas terminales.
  - id: SEP-002
    rule: Separación vertical mínima
    value: 1000
    unit: ft
    source: ICAO Doc 4444 5.3.2 (RVSM FL290-FL410)
    code: realism/regulatoryProfiles.js (verticalSeparationFt); constants/aircraftConstants.js (SEPARATION.VERTICAL_FT)
    check: { module: constants/aircraftConstants, export: SEPARATION, path: VERTICAL_FT, equals: 1000 }
    status: implementado
    notes: Tolerancia de 50 ft por la resolución del modo C mientras la aeronave se estabiliza (VERTICAL_SEPARATION_TOLERANCE_FT).
  - id: SEP-003
    rule: Por debajo de 1000 ft AGL la separación radar no se aplica; rigen la separación en pista, la de estela y las reglas de salida
    value: 1000
    unit: ft AGL
    source: ICAO Doc 4444 7 (control de aeródromo)
    code: realism/RealismController.js (RADAR_SEPARATION_MIN_HEIGHT_FT)
    status: implementado
  - id: SEP-004
    rule: Una pareja que entra ya sin separación es pérdida del sector anterior; solo cuenta si sigue así pasados 60 s
    value: 60
    unit: s
    source: Decisión del simulador
    code: realism/RealismController.js (HANDOVER_GRACE_SECONDS)
    status: implementado
  - id: SEP-005
    rule: Una aeronave nueva solo aparece con margen extra respecto a las demás
    value: "separación radar + 5 NM, vertical + 1000 ft"
    source: Decisión del simulador
    code: realism/RealismController.js (SPAWN_SEPARATION_MARGIN)
    status: implementado
  - id: SEP-006
